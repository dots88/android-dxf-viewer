<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>DXF Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; color: #eaeaea; background: #121212; overflow: hidden; }

        #toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        #toolbar button {
            background: #2e2e2e;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        #toolbar button:active { background: #444; }

        #info {
            font-size: 12px;
            color: #aaa;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #layers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }
        #layers label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="zoomIn">+</button>
        <button id="zoomOut">−</button>
        <button id="reset">Fit</button>
        <span id="info">No file loaded</span>
        <div id="layers"></div>
    </div>
    <canvas id="canvas"></canvas>
    <script src="viewer.js"></script>
</body>
</html>
